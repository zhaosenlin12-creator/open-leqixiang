# =====================================================================
# 乐启享数字展厅 — HTTPS server block 模板
#
# 适用于：有自己的域名，想走 HTTPS（推荐，Chrome 现代特性都要求
# 安全上下文）。
#
# 两种证书来源：
#   A. Let'\''s Encrypt（certbot 免费，需要 80 端口可访问）
#   B. 自签 / 内部 CA（内网用）
#
# A 方案用法（推荐机构对外）：
#   1) sudo apt install certbot python3-certbot-nginx
#   2) sudo certbot --nginx -d your-domain.com
#   3) certbot 会自动帮你加证书路径，下面这块就自动生效
#
# B 方案用法（纯内网）：
#   1) openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#      -keyout /etc/ssl/private/leqixiang.key \
#      -out /etc/ssl/certs/leqixiang.crt \
#      -subj "/CN=your-internal-host"
#   2) 把下面 ssl_certificate 改成上面的路径
# =====================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;     # 改成你的域名

    root /var/www/leqixiang;
    index index.html;

    # ---- 证书路径（certbot 会自动改这块） ----    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # ---- 现代 TLS 配置 ----    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：开了之后浏览器一年内强制 HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 性能
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/ttf font/otf;

    # ---- 入口文件 ----    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---- 带哈希的资源 ----    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- 媒体文件 ----    location ~* ^/(images|students|home|staff|courses|honors|about|pricing|showreel|brand|content)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ---- Manifest ----    location ~* \.json$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300" always;
    }

    # ---- SPA 兜底 ----    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 把 80 的请求 301 到 443
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}
