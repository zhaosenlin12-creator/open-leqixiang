# =====================================================================
# 乐启享数字展厅 — 独立 server block 模板
#
# 适用于：服务器上只有这一个站点，或者想独占 80/443。
# 用法：
#   sudo cp leqixiang-standalone.conf /etc/nginx/sites-available/leqixiang
#   sudo ln -s /etc/nginx/sites-available/leqixiang /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 部署目录约定：/var/www/leqixiang/  下放 dist/ 全部内容
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;                                  # 没域名就写 _    # 如果有域名，把上面一行改成 server_name your-domain.com;

    root /var/www/leqixiang;
    index index.html;

    # ---- 安全/性能 默认 ----    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # ---- gzip 压缩文本 ----    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/ttf font/otf;

    # ---- 入口文件必须回源 ----    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- 带哈希的资源：一年 immutable（Vite 已带哈希，永久缓存安全） ----    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- 媒体文件（图片/视频/海报）：30 天长缓存 ----    location ~* ^/(images|students|home|staff|courses|honors|about|pricing|showreel|brand|content)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ---- Manifest JSON：5 分钟，避免脏数据 ----    location ~* \.json$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300" always;
    }

    # ---- SPA 兜底：本项目没有客户端路由，但留着无害 ----    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 安全头 ----    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 视频走 cross-origin 时才需要打开 CORP，否则别加：
    # add_header Cross-Origin-Resource-Policy "cross-origin" always;
}
